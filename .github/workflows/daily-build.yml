# Build lại web mỗi ngày để lấy nội dung mới từ Notion.
# Cần 1 secret trong GitHub repo: CLOUDFLARE_DEPLOY_HOOK (link Deploy Hook của Cloudflare Pages).
name: Daily rebuild

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 3:00 sáng giờ Việt Nam
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Deploy Hook của Cloudflare Pages
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Chưa có secret CLOUDFLARE_DEPLOY_HOOK, bỏ qua."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
