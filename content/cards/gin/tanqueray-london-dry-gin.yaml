# ---------- Mục 3. Cách uống ----------
serve_neat_vi: Rót khoảng 30 ml vào ly nhỏ miệng hẹp, nhiệt độ phòng. Để vài phút cho mùi juniper mở ra.
serve_rocks_vi: Một viên đá lớn trong ly rocks. Đá tan chậm giúp vị dịu dần mà không bị loãng nhanh.
serve_tonic_vi: "Highball nhiều đá, tỷ lệ 1 gin : 3 tonic."
tonic_garnish_vi: Chanh vàng
tonic_garnish_why_vi: Một lát chanh vàng làm rõ note vỏ chanh trong mùi, giữ G&T khô và sạch đúng chất London Dry.

# ---------- Mục 4. Pairing món Việt ----------
pairing_vi: |
  Khai vị · cuốn | Gỏi cuốn tôm thịt | B | Juniper và coriander cộng hưởng với húng quế, rau thơm trong cuốn, làm mùi thảo mộc rõ và kéo dài hơn. | G&T, lát chanh vàng
  Nướng | Bò lá lốt | B | Mùi lá lốt nướng và tiêu được nâng lên nhờ vị cay ấm của coriander và hậu vị như tiêu của gin. | On the rocks
  Món kho | Cá kho tộ | A | Món đậm mặn ngọt, thiếu độ tươi. Gin thêm mùi cam quýt và thảo mộc, giúp miếng ăn nhẹ hơn. | G&T, lát chanh vàng
  Hải sản | Tôm nướng muối ớt | A | Gin thêm lớp mùi thảo mộc và cam quýt mà muối ớt không có, giống vắt chanh lên tôm. | G&T
  Chiên | Chả giò | C | Gin khô, sắc cắt vị béo của dầu chiên, rửa vòm miệng nhưng vẫn để vị thịt và nấm dẫn dắt. | G&T nhiều đá
  Tráng miệng | Chè bưởi | C | Vị khô, hơi đắng của juniper đối lập với cốt dừa ngọt béo; mùi cam quýt nối với vỏ bưởi. | Neat, ly nhỏ

