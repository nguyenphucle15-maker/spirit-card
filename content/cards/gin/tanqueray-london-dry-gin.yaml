# ---------- Mục 1. Lịch sử & sản xuất ----------
history_summary_vi: Gần 200 năm, công thức bốn botanicals của Tanqueray gần như không đổi và trở thành chuẩn tham chiếu cho dòng London Dry.

history_timeline_vi: |
  1830 | Charles Tanqueray, khi đó 20 tuổi, phá lệ gia đình vốn theo nghề mục sư, mở xưởng chưng cất trên phố Vine, khu Bloomsbury, London. Khu này thời đó nổi tiếng có nguồn nước tốt.
  Những năm 1830 | Ông thử nghiệm hơn 300 công thức, cuối cùng chốt bốn botanicals: juniper, coriander, angelica root và liquorice. Những công thức còn lại sau này là cảm hứng cho các dòng Tanqueray khác.
  1868 | Charles qua đời, con trai Charles Waugh Tanqueray tiếp quản công ty.
  1898 [cần kiểm tra] | Tanqueray sáp nhập với Gordon's thành Tanqueray Gordon & Co., hai cái tên lớn của gin London về chung một nhà.
  Thế chiến II [cần kiểm tra] | Xưởng ở London bị bom phá hủy gần hết. Theo câu chuyện của hãng, chỉ một nồi chưng cất còn sống sót và vẫn được dùng đến nay.
  1997 | Ra mắt Tanqueray Malacca, phiên bản ngọt và nhiều hương trái cây hơn (nổi bật là bưởi).
  1998 | Sản xuất chuyển về Cameronbridge ở Fife, Scotland. Gin vẫn được gọi là London Dry vì tên gọi này chỉ quy trình, không chỉ nơi làm ra rượu.
  2005–2007 | Tanqueray London Dry nhận Double Gold ba năm liên tiếp tại San Francisco World Spirits Competition.
  2021 | Ra mắt Tanqueray 0.0%, phiên bản không cồn.

